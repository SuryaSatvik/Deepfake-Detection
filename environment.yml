# conda env create -f environment.yml && conda activate deepfake-dfe
# Then install torch for your CUDA version (see requirements.txt) — conda's
# pytorch build is deliberately not pinned here for the same reason.
name: deepfake-dfe
channels: [conda-forge]
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - jinja2>=3.1
  - jupyter
  - ipykernel
  - ipywidgets
  - pip:
      - opencv-python>=4.8
      - Pillow>=10.0
      - imageio>=2.31
      - imageio-ffmpeg>=0.4.9
      - timm>=0.9.12
      - streamlit>=1.30
      - transformers>=4.49
      - accelerate>=0.30
      - peft>=0.11
      - bitsandbytes>=0.43
      - qwen-vl-utils>=0.0.8
      - sentencepiece>=0.2
      - safetensors>=0.4
